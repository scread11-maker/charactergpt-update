name: SSPGPT v0.8 R6 Export Pinned Source

on:
  push:
    branches: [v08-r6-repair-20260823]
    paths: ['.github/workflows/sspgpt-v08-r6-export-source.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/sspgpt-v08-r6-export-source.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Diagnose pinned source container
        shell: bash
        run: |
          set -u
          echo "CONTAINER_BYTES=$(wc -c < build/sspgpt/v08/source.zip)"
          sha256sum build/sspgpt/v08/source.zip
          echo 'ELLIPSIZATION_MARKERS:'
          grep -abo 'ELLIPSIZATION' build/sspgpt/v08/source.zip || true
          tr -d '\r\n' < build/sspgpt/v08/source.zip | base64 -d > /tmp/decoded.zip
          echo "DECODED_BYTES=$(wc -c < /tmp/decoded.zip)"
          sha256sum /tmp/decoded.zip
          file /tmp/decoded.zip || true
          echo 'HEAD:'; xxd -l 32 /tmp/decoded.zip || true
          echo 'TAIL:'; tail -c 64 /tmp/decoded.zip | xxd || true
          echo 'ZIP_TEST:'
          unzip -t /tmp/decoded.zip || true
