name: Finalize fix15 MCP listener invariant

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.ref == 'fix15-mcp-rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix15-mcp-rebuild
      - name: Replace false-positive listener invariant and self-remove
        shell: python
        run: |
          from pathlib import Path
          p=Path('build/sspgpt/src/tools/v071_architecture_audit.py')
          s=p.read_text(encoding='utf-8')
          old="checks['mcp_no_public_or_local_data_listener']='NewStreamableHTTPHandler' not in link and '/mcp' not in link and 'http.ListenAndServe' not in link"
          new="checks['mcp_no_public_or_local_data_listener']='NewStreamableHTTPHandler' not in link and 'mux.Handle(\"/mcp\"' not in link and 'http.ListenAndServe' not in link"
          if old not in s:
              raise SystemExit('old listener invariant not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          Path('.github/workflows/fix15-audit-listener.yml').unlink()
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Make fix15 MCP listener audit precise'
          git push origin HEAD:fix15-mcp-rebuild
