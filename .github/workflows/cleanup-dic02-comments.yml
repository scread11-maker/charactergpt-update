name: Cleanup dic02 comments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-dic02-comments.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean historical comment labels and sync manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('v061/ghost/master/dic02_touch.txt')
          raw = p.read_bytes()
          text = raw.decode('utf-8-sig')
          original = text.splitlines()
          lines = original[:]

          def find(prefix):
              hits = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(hits) != 1:
                  raise SystemExit(f'Expected exactly one marker {prefix!r}, got {len(hits)}')
              return hits[0]

          def replace_comments(prefix, count, new_lines):
              i = find(prefix)
              old = lines[i:i+count]
              if len(old) != count or not all(x.startswith('＃') for x in old):
                  raise SystemExit(f'Expected {count} comment lines at {prefix!r}')
              lines[i:i+count] = new_lines

          # Header contract block: replace the historical 21-line changelog with current contracts.
          if len(lines) < 22 or not all(x.startswith('＃') for x in lines[:21]) or lines[21] != '':
              raise SystemExit('Unexpected dic02 header layout')
          lines[:21] = [
              '＃ Touch/contact adapter contracts.',
              '＃ POINTER single events reach Runtime immediately; only touch-memory commit waits 600ms so a completed double click can cancel provisional light_touch memory.',
              '＃ Contact phases: MOVING -> STATIONARY -> RESTING -> MOVING.',
              r'＃ Recognised collision MOVE events are transported; visible-balloon MOVE uses SATORI script-head \\C so hover does not replace the current balloon.',
              '＃ MouseLeave / MouseLeaveAll do not go to Runtime, Bridge/LLM, or gesture intensity; active contacts may close only through the local contact helper.',
              '＃ During talking/choosing/visible balloon, Leave returns no script.',
              '＃ Local reflexes:',
              '＃ - Head/Hair keep Runtime sustained-touch timing.',
              '＃ - Bust hover is transient: first MOVE uses surface 2 and leaving restores normally.',
              '＃ - Bust click is latched with surface 22 until formal Runtime/LLM presentation owns the expression.',
              '＃ - Bust single-click memory is deferred so a completed double click becomes canonical grab without leaking light_touch.',
              '＃ - Bust double-click keeps POINTER|double transport; Bridge canonicalizes it to grab.',
              '＃ - Every recognised touch exits idle-reading and restarts the 3-minute idle timer.',
              '＃ - Book single click uses surface 0/base1 and is locally latched for at least 1000ms so MouseLeave cannot erase it immediately.',
              '＃ - Book MOVE/stroking reacts locally on first movement with surface 0/base1 while preserving Runtime semantics.',
          ]

          replace_comments('＃ r6-test31e: target-change self-heal.', 1, [
              '＃ Target-change self-heal: if SATORI still tracks an older target but a recognised MOVE arrives on another target/character, close the stale helper lifecycle without LLM presentation and begin the newly observed contact.'
          ])
          replace_comments('＃ r6-test7 contact-state start/resume helpers.', 1, [
              '＃ Contact-state start/resume helpers.'
          ])
          replace_comments('＃ alpha5-r6-test4:', 3, [
              '＃ Re-entry boundary is non-blocking and preserves visible balloons.',
              r'＃ \C must be at the true SakuraScript head; in SATORI this requires ＄スクリプトの一番頭. Preserve branches do not change the current balloon timeout.'
          ])
          replace_comments('＃ Local leave reflex restoration.', 2, [
              '＃ Leave reflex: hover restores on leave, but a completed Bust click remains latched until response presentation clears it.'
          ])
          replace_comments('＃ r6-test8:', 2, [
              '＃ OnMouseHover is positive evidence that the cursor is still inside a collision; absence of MOVE alone is not continued physical contact.'
          ])
          replace_comments('＃ r6-test31e: local established-contact gate.', 1, [
              '＃ Established-contact gate only prevents a sub-250ms lifecycle-only exit from consuming a Bridge release request; TouchProgress still receives and records the release.'
          ])
          replace_comments('＃ r6-test11 stationary/resting state machine.', 7, [
              '＃ Stationary/resting state machine.',
              '＃ OnMouseHover is positive evidence for an early stationary transition.',
              '＃ Every recognised MOVE restarts the 900ms stationary timer; if it fires while the same contact remains active, the cursor becomes stationary.',
              '＃ MouseLeave cancels this path and clears the active helper session. The helper backdates stationary by 900ms, so the 2100ms resting timer commits at about 3.0s after the last MOVE.'
          ])
          replace_comments('＃ r6-test6 long-stroke progress checkpoints.', 3, [
              '＃ Long-stroke progress checkpoints.',
              '＃ MouseLeave only clears CharacterGPTTemporalTouchActive; it emits no HTTP/websocket here.',
              '＃ Each boundary start restarts the same timer event, preventing stale-session timers.'
          ])

          original_non = [line for line in original if not line.startswith('＃')]
          cleaned_non = [line for line in lines if not line.startswith('＃')]
          if original_non != cleaned_non:
              raise SystemExit('Non-comment lines changed; refusing to commit')

          out = b'\xef\xbb\xbf' + ('\n'.join(lines) + '\n').encode('utf-8')
          md5 = hashlib.md5(out).hexdigest()
          size = len(out)
          if (md5, size) != ('7505fb363b793b9ac1537b95eccb4c5e', 67123):
              raise SystemExit(f'Unexpected cleaned bytes: md5={md5} size={size}')
          p.write_bytes(out)

          manifest = Path('v061/updates2.dau')
          mlines = manifest.read_text(encoding='utf-8').splitlines()
          prefix = 'ghost/master/dic02_touch.txt\x01'
          hits = [i for i, line in enumerate(mlines) if line.startswith(prefix)]
          if len(hits) != 1:
              raise SystemExit('dic02_touch manifest entry not found uniquely')
          mlines[hits[0]] = f'ghost/master/dic02_touch.txt\x01{md5}\x01size={size}\x01'
          manifest.write_text('\n'.join(mlines) + '\n', encoding='utf-8')

          print(f'dic02_touch.txt md5={md5} size={size}')
          print(f'non-comment lines preserved: {len(original_non)}')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v061/ghost/master/dic02_touch.txt v061/updates2.dau
          git diff --cached --check
          git commit -m 'Clean dic02 touch contract comments'
          git push
