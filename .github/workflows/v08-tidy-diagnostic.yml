name: SSPGPT v0.8 Go 1.27 module diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v08-tidy-diagnostic.yml'
      - 'build/sspgpt/v08/**'
permissions:
  contents: read
jobs:
  tidy-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Reconstruct source and show canonical module diff
        shell: bash
        run: |
          set -euo pipefail
          a="$RUNNER_TEMP/v08.zip"
          cat \
            build/sspgpt/v08/source_chunks/part00.b64 \
            build/sspgpt/v08/source_chunks/part01.b64 \
            build/sspgpt/v08/source_parts/part01.b64 \
            build/sspgpt/v08/source_parts/part02.b64 \
            build/sspgpt/v08/source_parts/part03.b64 \
            build/sspgpt/v08/source_chunks/part08.b64 \
            build/sspgpt/v08/source_chunks/part09.b64 \
            build/sspgpt/v08/source_chunks/part10.b64 \
            build/sspgpt/v08/source_chunks/part11.b64 | base64 -d > "$a"
          echo '416a3176adb794b8e936a740d7f859bcce67e90a1f547f5167a3980867131410  '"$a" | sha256sum -c -
          mkdir src && unzip -oq "$a" -d src
          cd src
          go mod tidy -diff || true
          cp go.mod /tmp/before.mod
          go mod tidy
          echo '--- canonical go.mod ---'
          cat go.mod
          echo '--- canonical go.sum ---'
          test ! -f go.sum || cat go.sum
