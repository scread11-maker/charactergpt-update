name: Promote v07 fix9 online-update semantics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-v07-fix9.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch YAYA update semantics and manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('v07/ghost/master/cgpt_core.dic')
          s = p.read_text(encoding='utf-8-sig')
          old_ready = '''OnUpdateReady\n{\n    "\\0\\s[100]確認到%(reference[0])個更新檔案。\\w5\\n正在更新……"\n}\n'''
          new_ready = '''OnUpdateReady\n{\n    _count = TOINT(reference[0]) + 1\n    "\\0\\s[100]確認到%(_count)個更新檔案。\\w5\\n正在更新……"\n}\n'''
          if old_ready not in s:
              raise SystemExit('OnUpdateReady baseline mismatch')
          s = s.replace(old_ready, new_ready, 1)
          old_events = '''OnUpdateComplete\n{\n    "\\0\\s[25]\\![set,balloontimeout,%(CGPT.BalloonTimeoutMs)]CharacterGPT 網路更新完成。\\nSSP 結果：%(reference[0])\\n更新檔案：%(reference[1])\\e"\n}\nOnUpdateFailure\n{\n    if reference[0] == 'none' {\n        OnCharacterGPTUpdateNone\n        return\n    }\n    "\\0\\s[3]\\![set,balloontimeout,0]CharacterGPT 網路更新失敗。\\n原因：%(reference[0])\\n未完成檔案：%(reference[1])\\e"\n}\nOnCharacterGPTUpdateNone\n{\n    "\\0\\s[25]\\![set,balloontimeout,2200]目前已是最新版本。\\e"\n}\nOnUpdateCheckComplete\n{\n    "\\0\\s[25]\\![set,balloontimeout,%(CGPT.BalloonTimeoutMs)]CharacterGPT 更新檢查完成。\\nSSP 結果：%(reference[0])\\e"\n}\nOnUpdateCheckFailure\n{\n    if reference[0] == 'none' {\n        OnCharacterGPTUpdateNone\n        return\n    }\n    "\\0\\s[3]\\![set,balloontimeout,0]CharacterGPT 更新檢查失敗。\\n原因：%(reference[0])\\e"\n}\n'''
          new_events = '''OnUpdateComplete\n{\n    if reference[0] == 'none' {\n        OnCharacterGPTUpdateNone\n        return\n    }\n    "\\0\\s[25]\\![set,balloontimeout,%(CGPT.BalloonTimeoutMs)]CharacterGPT 網路更新完成。\\nSSP 結果：%(reference[0])\\n更新檔案：%(reference[1])\\e"\n}\nOnUpdateFailure\n{\n    "\\0\\s[3]\\![set,balloontimeout,0]CharacterGPT 網路更新失敗。\\n原因：%(reference[0])\\n未完成檔案：%(reference[1])\\e"\n}\nOnCharacterGPTUpdateNone\n{\n    "\\0\\s[25]\\![set,balloontimeout,2200]目前已是最新版本。\\e"\n}\nOnUpdateCheckComplete\n{\n    if reference[0] == 'none' {\n        OnCharacterGPTUpdateNone\n        return\n    }\n    "\\0\\s[25]\\![set,balloontimeout,%(CGPT.BalloonTimeoutMs)]CharacterGPT 更新檢查完成。\\nSSP 結果：%(reference[0])\\e"\n}\nOnUpdateCheckFailure\n{\n    "\\0\\s[3]\\![set,balloontimeout,0]CharacterGPT 更新檢查失敗。\\n原因：%(reference[0])\\e"\n}\n'''
          if old_events not in s:
              raise SystemExit('update event baseline mismatch')
          p.write_text(s.replace(old_events, new_events, 1), encoding='utf-8')

          Path('v07/readme.txt').write_text('''SSPGPT v0.7 online update channel\nCurrent presentation baseline: v0.7-alpha1-fix9 Online Update Baseline\nPublished: 2026-08-19\n\nThis SSP-native channel updates YAYA presentation/adapter text files only.\nCore executables, YAYA DLL, local configuration, character data, credentials,\nmemory state, logs, and other user-local state are intentionally excluded.\n\nFor core Runtime/Bridge/MemoryService/TouchProgress updates, install the latest NAR.\n''', encoding='utf-8')

          import hashlib
          files = [
              'ghost/master/cgpt_core.dic',
              'ghost/master/cgpt_touch.dic',
              'ghost/master/descript.txt',
              'ghost/master/system_config.txt',
              'ghost/master/yaya.txt',
              'ghost/master/yaya_config.txt',
              'readme.txt',
          ]
          root = Path('v07')
          sep = '\x01'
          rows = []
          for rel in files:
              b = (root / rel).read_bytes()
              rows.append(f'{rel}{sep}{hashlib.md5(b).hexdigest()}{sep}size={len(b)}{sep}\n')
          (root / 'updates2.dau').write_bytes(''.join(rows).encode('utf-8'))
          PY

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('v07/ghost/master/cgpt_core.dic')
          assert hashlib.md5(p.read_bytes()).hexdigest() == 'f4f25d697190e9cab5255d83becd3f52'
          assert len(p.read_bytes()) == 27056
          m = Path('v07/updates2.dau').read_bytes()
          assert b'f4f25d697190e9cab5255d83becd3f52' in m
          assert b'size=27056' in m
          assert b'.exe' not in m.lower() and b'.dll' not in m.lower()
          PY

      - name: Commit canonical fix9 channel and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/promote-v07-fix9.yml
          git config user.name 'CharacterGPT Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Promote SSPGPT v0.7 fix9 online-update baseline'
          git push
