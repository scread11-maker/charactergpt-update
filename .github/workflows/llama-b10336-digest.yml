name: llama.cpp b10336 digest probe
on:
  push:
    branches: [ci/v08-go127-acceptance]
    paths: ['.github/workflows/llama-b10336-digest.yml']
permissions:
  contents: read
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Read official GitHub release asset digests
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.github.com/repos/ggml-org/llama.cpp/releases/tags/b10336'
          json="$(curl -fsSL -H 'Accept: application/vnd.github+json' "$api")"
          for name in llama-b10336-bin-win-cpu-x64.zip llama-b10336-bin-win-cuda-12.4-x64.zip cudart-llama-bin-win-cuda-12.4-x64.zip; do
            digest="$(jq -r --arg n "$name" '.assets[] | select(.name==$n) | .digest' <<<"$json")"
            test "$digest" != null
            test -n "$digest"
            printf '%s %s\n' "$name" "$digest"
          done
