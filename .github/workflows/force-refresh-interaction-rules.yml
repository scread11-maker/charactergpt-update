name: Force refresh interaction rules

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-refresh-interaction-rules.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump interaction rules bytes without semantic change
        shell: bash
        run: |
          python -c "from pathlib import Path; import hashlib,json; p=Path('v061/ghost/master/config/interaction_rules.json'); b=p.read_bytes(); assert hashlib.md5(b).hexdigest()=='528bf17e17441a80e63150d2faed06e5' and len(b)==15627; assert b.endswith(b'\\n'); nb=b+b'\\n'; json.loads(nb.decode('utf-8')); p.write_bytes(nb); md5=hashlib.md5(nb).hexdigest(); size=len(nb); m=Path('v061/updates2.dau'); t=m.read_text(encoding='utf-8'); old='ghost/master/config/interaction_rules.json\\x01528bf17e17441a80e63150d2faed06e5\\x01size=15627\\x01'; new=f'ghost/master/config/interaction_rules.json\\x01{md5}\\x01size={size}\\x01'; assert t.count(old)==1; m.write_text(t.replace(old,new,1),encoding='utf-8',newline='\\n'); print(md5,size)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v061/ghost/master/config/interaction_rules.json v061/updates2.dau
          git diff --cached --check
          git commit -m 'Force refresh final interaction rules'
          git push
