name: Add runtime pending presentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-runtime-pending-presentation.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add pending Satori handlers and sync manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('v061/ghost/master/dic00_system.txt')
          data = p.read_bytes()
          if hashlib.md5(data).hexdigest() != '1a9064a9d3b332e8b895a626764937ba' or len(data) != 14154:
              raise SystemExit('unexpected dic00 baseline')
          if not data.startswith(b'\xef\xbb\xbf'):
              raise SystemExit('dic00 BOM missing')
          text = data[3:].decode('utf-8')
          anchor = '''＊OnCharacterGPTClose
＄CharacterGPTBustClickLatched\t0
：\\0\\s[3]\\![set,balloontimeout,（CharacterGPTBalloonTimeoutMs）]sspgpt Runtime 已中斷。\\e

'''
          insert = '''＊OnCharacterGPTClose
＄CharacterGPTBustClickLatched\t0
：\\0\\s[3]\\![set,balloontimeout,（CharacterGPTBalloonTimeoutMs）]sspgpt Runtime 已中斷。\\e

＠CharacterGPTChatPendingPrompt
嗯……
等我一下。
我想一下……

＊OnCharacterGPTChatPending
：\\![timerraise,0,1,OnCharacterGPTSurfaceRestore]\\![timerraise,0,1,OnCharacterGPTBalloonTimeout]\\0\\s[122]\\![set,balloontimeout,0]（CharacterGPTChatPendingPrompt）\\e

＊OnCharacterGPTTouchPending
：\\![timerraise,0,1,OnCharacterGPTSurfaceRestore]\\![timerraise,0,1,OnCharacterGPTBalloonTimeout]\\0\\s[2]\\![set,balloontimeout,0]!?\\e

'''
          if text.count(anchor) != 1:
              raise SystemExit('expected OnCharacterGPTClose anchor not found exactly once')
          text = text.replace(anchor, insert, 1)
          out = b'\xef\xbb\xbf' + text.encode('utf-8')
          md5 = hashlib.md5(out).hexdigest()
          size = len(out)
          if md5 != '393d7315b82a9268b70e209149a7bfd8' or size != 14595:
              raise SystemExit(f'unexpected dic00 result md5={md5} size={size}')
          p.write_bytes(out)

          manifest = Path('v061/updates2.dau')
          lines = manifest.read_text(encoding='utf-8').splitlines()
          prefix = 'ghost/master/dic00_system.txt\x01'
          hits = 0
          for i, line in enumerate(lines):
              if line.startswith(prefix):
                  lines[i] = f'ghost/master/dic00_system.txt\x01{md5}\x01size={size}\x01'
                  hits += 1
          if hits != 1:
              raise SystemExit(f'manifest dic00 hits={hits}')
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          print(f'dic00 md5={md5} size={size}')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v061/ghost/master/dic00_system.txt v061/updates2.dau
          git diff --cached --check
          git commit -m 'Add local pending presentation handlers'
          git push
