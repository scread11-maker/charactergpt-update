name: Refine wry smile output guidance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-wry-smile-output-guidance.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine wry smile output guidance and sync manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          p = Path('v061/ghost/master/config/interaction_rules.json')
          text = p.read_text(encoding='utf-8')
          old = '''    {
      "id": "wry_smile_expression",
      "target": "*",
      "gesture": "*",
      "meaning": [
        "wry_smile = restrained/wry smile; context may make it bitter, resigned, awkward, dryly amused, or gently teasing",
        "smirk remains valid for a more knowingly teasing, sardonic, or self-assured reading; both may share the same visual surface"
      ],
      "notes": [
        "Choose wry_smile or smirk from context; do not infer mockery or superiority from the visual surface alone.",
        "embarrassed_wry_smile and embarrassed_smirk remain valid in the same blush-capable visual family."
      ]
    },
'''
          new = '''    {
      "id": "wry_smile_expression",
      "target": "*",
      "gesture": "*",
      "meaning": [
        "Use emotion=wry_smile for a restrained, bitter, resigned, awkward, or dry smile.",
        "Use emotion=smirk for a more knowingly teasing, sardonic, or self-assured smile; both may share the same visual surface."
      ],
      "notes": [
        "Use embarrassed_wry_smile when embarrassment/shyness is the semantic reason for a wry smile; use blush_wry_smile when that expression is visibly flushed/red-faced.",
        "embarrassed_smirk and blush_smirk remain valid for the smirk reading; do not infer mockery or superiority from the visual surface alone."
      ]
    },
'''
          if text.count(old) != 1:
              raise SystemExit('expected current wry_smile block not found exactly once')
          text = text.replace(old, new, 1)
          json.loads(text)
          p.write_text(text, encoding='utf-8', newline='\n')

          data = p.read_bytes()
          md5 = hashlib.md5(data).hexdigest()
          size = len(data)

          manifest = Path('v061/updates2.dau')
          lines = manifest.read_text(encoding='utf-8').splitlines()
          prefix = 'ghost/master/config/interaction_rules.json\x01'
          hits = 0
          for i, line in enumerate(lines):
              if line.startswith(prefix):
                  lines[i] = f'ghost/master/config/interaction_rules.json\x01{md5}\x01size={size}\x01'
                  hits += 1
          if hits != 1:
              raise SystemExit(f'manifest entry hits={hits}')
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          print(f'interaction_rules md5={md5} size={size}')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v061/ghost/master/config/interaction_rules.json v061/updates2.dau
          git diff --cached --check
          git commit -m 'Calibrate wry smile output guidance'
          git push
