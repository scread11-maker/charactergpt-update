name: SSPGPT v0.8 r5 Source Snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  SOURCE_ROOT: build/sspgpt/v08-r5/source
  SOURCE_ARCHIVE_SHA256: dec8d9aa7942ed84da102ebfe7f35313cbd38cf0d17a167a38f3883ffb90223f

jobs:
  snapshot:
    name: Materialize prior verified source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Materialize exact prior source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SOURCE_ROOT"
          mkdir -p "$SOURCE_ROOT"
          cat build/sspgpt/v08-r5/seed/part* | base64 -d > /tmp/v08-r5-source.tar.xz
          echo "$SOURCE_ARCHIVE_SHA256  /tmp/v08-r5-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/v08-r5-source.tar.xz -C "$SOURCE_ROOT"
          test -f "$SOURCE_ROOT/go.mod"
          tar -czf /tmp/sspgpt-v08-r5-prior-source.tar.gz -C "$SOURCE_ROOT" .
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: SSPGPT-v08-r5-prior-source-snapshot
          path: /tmp/sspgpt-v08-r5-prior-source.tar.gz
          if-no-files-found: error
          retention-days: 2
