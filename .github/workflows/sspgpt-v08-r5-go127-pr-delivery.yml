name: SSPGPT v0.8 Go 1.27 Repair-of-Repair Delivery

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  SOURCE_ROOT: build/sspgpt/v08-r5/source
  PRIOR_SOURCE_SHA256: dec8d9aa7942ed84da102ebfe7f35313cbd38cf0d17a167a38f3883ffb90223f
  PATCH1_SHA256: 4f55dc52584666637a9ce18c203a7877c0d1434af3dc207fdf28ac6ae3e7f6d9
  PATCH2_SHA256: 20ca246b9759b3c57c1678a80d00232853d76a2c5e1aaa4aa3b166bed4ae6451

jobs:
  verify-and-build:
    name: Go 1.27 verify and Windows amd64 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Materialize prior verified source and apply reviewed rollback
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SOURCE_ROOT"
          mkdir -p "$SOURCE_ROOT"
          cat build/sspgpt/v08-r5/seed/part* | base64 -d > /tmp/v08-r5-prior-source.tar.xz
          echo "$PRIOR_SOURCE_SHA256  /tmp/v08-r5-prior-source.tar.xz" | sha256sum -c -
          echo "$PATCH1_SHA256  build/sspgpt/v08-r5/repair_of_repair_prod_part1.patch" | sha256sum -c -
          echo "$PATCH2_SHA256  build/sspgpt/v08-r5/repair_of_repair_prod_part2.patch" | sha256sum -c -
          tar -xJf /tmp/v08-r5-prior-source.tar.xz -C "$SOURCE_ROOT"
          patch -d "$SOURCE_ROOT" -p1 --batch --forward < build/sspgpt/v08-r5/repair_of_repair_prod_part1.patch
          patch -d "$SOURCE_ROOT" -p1 --batch --forward < build/sspgpt/v08-r5/repair_of_repair_prod_part2.patch

          echo '83892a8c2df0a6d0b1cf66657706f14789d28658b6adc4c22df86f8f441a2463  build/sspgpt/v08-r5/source/internal/supervisor/supervisor.go' | sha256sum -c -
          echo '4cd907b2f42e9c637386e864f6320d6fa44cec4a08dea1fc7f1daa3b183b326a  build/sspgpt/v08-r5/source/internal/servicehost/http.go' | sha256sum -c -
          echo '26d1484a0159231612664debbbd6ad2d14e4e7fdbac00a10aa6fef3615fdab56  build/sspgpt/v08-r5/source/internal/runtime/service.go' | sha256sum -c -
          echo '802fb674aaf9c6048613c3745d486ec4f6312eb39e83e1dc4bb4af7b998d44cd  build/sspgpt/v08-r5/source/cmd/runtime/main.go' | sha256sum -c -

          ! grep -R -n -E 'HostActionStepForYAYA|/v1/yaya/host-action-step' "$SOURCE_ROOT/internal/runtime"
          ! grep -R -n -E 'process_instance_id|os\.FindProcess|unhealthyThreshold' "$SOURCE_ROOT/internal/supervisor" "$SOURCE_ROOT/internal/servicehost"

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Verify module and Go version
        working-directory: build/sspgpt/v08-r5/source
        env:
          GOTOOLCHAIN: local
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'module sspgpt/v08' go.mod
          grep -Fx 'go 1.27.0' go.mod
          ! grep -q '^toolchain ' go.mod
          test "$(go env GOVERSION)" = 'go1.27.0'
          go mod tidy -diff

      - name: Add narrow repair-of-repair regression gates
        working-directory: build/sspgpt/v08-r5/source
        shell: bash
        run: |
          set -euo pipefail
          cat > internal/supervisor/repair_of_repair_ci_test.go <<'GO'
          package supervisor

          import (
              "context"
              "net/http"
              "net/http/httptest"
              "os/exec"
              "syscall"
              "testing"
              "time"
          )

          func TestCIHealthMissDoesNotKillOwnedChild(t *testing.T) {
              srv := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, _ *http.Request) {
                  w.WriteHeader(http.StatusServiceUnavailable)
              }))
              defer srv.Close()

              cmd := exec.Command("sleep", "20")
              if err := cmd.Start(); err != nil { t.Fatal(err) }
              done := make(chan error, 1)
              go func() { done <- cmd.Wait() }()

              managed := &managedChild{
                  child: Child{Name: "bridge", Health: srv.URL},
                  cmd: cmd,
                  waitDone: done,
              }
              var s Supervisor
              ctx, cancel := context.WithCancel(context.Background())
              go s.monitorChild(ctx, managed)

              time.Sleep(7 * time.Second)
              if err := cmd.Process.Signal(syscall.Signal(0)); err != nil {
                  t.Fatalf("health misses terminated owned live process: %v", err)
              }
              cancel()
              _ = cmd.Process.Kill()
              select {
              case <-done:
              case <-time.After(3 * time.Second):
                  t.Fatal("test helper process did not exit")
              }
          }
          GO

          cat > internal/runtime/repair_of_repair_ci_test.go <<'GO'
          package runtime

          import (
              "testing"
              "time"
              "sspgpt/v08/internal/abi"
          )

          func TestCIRegisterHostPlanPreservesTimingMetadata(t *testing.T) {
              deadline := time.Date(2026, 8, 23, 8, 0, 0, 0, time.UTC)
              service := &Service{plannedHostActions: map[string]plannedHostAction{}}
              plan := abi.HostActionPlan{
                  PlanID: "plan-1",
                  CausedByRequestID: "request-1",
                  CausationID: "cause-1",
                  HostContextRevision: 7,
                  Steps: []abi.HostActionPlanStep{{
                      ActionID: "action-1",
                      CapabilityID: "capability-1",
                      TypedParameters: map[string]any{"target": "muna"},
                      StartRelationOrDelay: map[string]any{"relation": "after_presentation", "delay_ms": float64(250)},
                      Deadline: deadline,
                  }},
              }
              service.registerHostPlan(plan)
              got, ok := service.plannedHostActions["action-1"]
              if !ok { t.Fatal("registered HostActionPlan step was not retained") }
              if got.StartRelationOrDelay == nil { t.Fatal("start_relation_or_delay was discarded") }
              if !got.Deadline.Equal(deadline) { t.Fatalf("deadline=%v want=%v", got.Deadline, deadline) }
          }
          GO

      - name: Test and vet
        working-directory: build/sspgpt/v08-r5/source
        env:
          GOTOOLCHAIN: local
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...

      - name: Build five Windows amd64 GUI executables
        working-directory: build/sspgpt/v08-r5/source
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        shell: bash
        run: |
          set -euo pipefail
          out='artifact/windows-amd64'
          mkdir -p "$out"
          go build -buildvcs=false -trimpath '-ldflags=-H=windowsgui' -o "$out/SSPGPTRuntime.exe" ./cmd/runtime
          go build -buildvcs=false -trimpath '-ldflags=-H=windowsgui' -o "$out/SSPGPTBridge.exe" ./cmd/bridge
          go build -buildvcs=false -trimpath '-ldflags=-H=windowsgui' -o "$out/SSPGPTMemoryService.exe" ./cmd/memoryservice
          go build -buildvcs=false -trimpath '-ldflags=-H=windowsgui' -o "$out/SSPGPTBehaviorService.exe" ./cmd/behaviorservice
          go build -buildvcs=false -trimpath '-ldflags=-H=windowsgui' -o "$out/SSPGPTTouchProgress.exe" ./cmd/touchprogress
          test "$(find "$out" -maxdepth 1 -type f -name 'SSPGPT*.exe' | wc -l)" -eq 5

      - name: Verify PE GUI and Go build metadata
        working-directory: build/sspgpt/v08-r5/source
        shell: bash
        run: |
          set -euo pipefail
          out='artifact/windows-amd64'
          python3 - "$out"/*.exe <<'PY'
          import struct, sys
          files = sys.argv[1:]
          assert len(files) == 5, files
          for name in files:
              b = open(name, 'rb').read()
              assert b[:2] == b'MZ', name
              pe = struct.unpack_from('<I', b, 0x3c)[0]
              assert b[pe:pe+4] == b'PE\0\0', name
              machine = struct.unpack_from('<H', b, pe+4)[0]
              subsystem = struct.unpack_from('<H', b, pe+24+68)[0]
              assert machine == 0x8664, (name, hex(machine))
              assert subsystem == 2, (name, subsystem)
          PY
          : > "$out/GO_BUILDINFO.txt"
          for f in "$out"/*.exe; do
            echo "===== $f =====" >> "$out/GO_BUILDINFO.txt"
            go version -m "$f" >> "$out/GO_BUILDINFO.txt"
          done
          test "$(grep -c 'go1.27.0' "$out/GO_BUILDINFO.txt")" -ge 5
          grep -q 'sspgpt/v08/cmd/runtime' "$out/GO_BUILDINFO.txt"
          grep -q 'sspgpt/v08/cmd/bridge' "$out/GO_BUILDINFO.txt"
          grep -q 'sspgpt/v08/cmd/memoryservice' "$out/GO_BUILDINFO.txt"
          grep -q 'sspgpt/v08/cmd/behaviorservice' "$out/GO_BUILDINFO.txt"
          grep -q 'sspgpt/v08/cmd/touchprogress' "$out/GO_BUILDINFO.txt"
          sha256sum "$out"/*.exe > "$out/SHA256SUMS.txt"
          cat > "$out/SOURCE_PROVENANCE.txt" <<EOF
          prior_source_archive_sha256=$PRIOR_SOURCE_SHA256
          repair_patch_part1_sha256=$PATCH1_SHA256
          repair_patch_part2_sha256=$PATCH2_SHA256
          supervisor_go_sha256=83892a8c2df0a6d0b1cf66657706f14789d28658b6adc4c22df86f8f441a2463
          servicehost_http_go_sha256=4cd907b2f42e9c637386e864f6320d6fa44cec4a08dea1fc7f1daa3b183b326a
          runtime_service_go_sha256=26d1484a0159231612664debbbd6ad2d14e4e7fdbac00a10aa6fef3615fdab56
          runtime_main_go_sha256=802fb674aaf9c6048613c3745d486ec4f6312eb39e83e1dc4bb4af7b998d44cd
          go_version=go1.27.0
          EOF

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: SSPGPT-v08-go127-amd64-repair-of-repair-final
          path: build/sspgpt/v08-r5/source/artifact/windows-amd64
          if-no-files-found: error
          retention-days: 14
