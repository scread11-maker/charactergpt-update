name: Migrate optional plug paths

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-plug-paths.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Satori optional-service paths to Plug
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('v061/ghost/master/dic00_system.txt')
          raw = p.read_bytes()
          text = raw.decode('utf-8-sig')
          old1 = 'bridge/CharacterGPTContextService.exe'
          old2 = 'bridge/CharacterGPTContextServiceStop.cmd'
          if text.count(old1) != 1 or text.count(old2) != 1:
              raise SystemExit('expected ContextService paths not found exactly once')
          text = text.replace(old1, 'Plug/CharacterGPTContextService.exe', 1)
          text = text.replace(old2, 'Plug/CharacterGPTContextServiceStop.cmd', 1)
          out = b'\xef\xbb\xbf' + text.encode('utf-8')
          p.write_bytes(out)

          md5 = hashlib.md5(out).hexdigest()
          size = len(out)
          manifest = Path('v061/updates2.dau')
          lines = manifest.read_text(encoding='utf-8').splitlines()
          prefix = 'ghost/master/dic00_system.txt\x01'
          for i, line in enumerate(lines):
              if line.startswith(prefix):
                  lines[i] = f'ghost/master/dic00_system.txt\x01{md5}\x01size={size}\x01'
                  break
          else:
              raise SystemExit('dic00 manifest entry missing')
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'dic00 md5={md5} size={size}')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v061/ghost/master/dic00_system.txt v061/updates2.dau
          git diff --cached --check
          git commit -m 'Move optional ContextService paths to Plug'
          git push
