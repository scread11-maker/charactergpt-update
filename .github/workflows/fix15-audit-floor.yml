name: Finalize fix15 audit floor

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.ref == 'fix15-mcp-rebuild'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix15-mcp-rebuild
      - name: Update module-floor invariant and self-remove
        shell: python
        run: |
          from pathlib import Path
          p=Path('build/sspgpt/src/tools/v071_architecture_audit.py')
          s=p.read_text(encoding='utf-8')
          old="checks['go126_module_floor']=('go 1.26.0' in go_mod)"
          new="checks['go126_module_floor']=('go 1.26.2' in go_mod)"
          if old not in s:
              raise SystemExit('old module-floor invariant not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          Path('.github/workflows/fix15-audit-floor.yml').unlink()
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Align fix15 architecture audit with Go 1.26.2 module floor'
          git push origin HEAD:fix15-mcp-rebuild
