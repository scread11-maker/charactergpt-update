name: Refine wry smile guidance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-wry-smile-guidance.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine existing interaction guidance and sync manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('v061/ghost/master/config/interaction_rules.json')
          text = p.read_text(encoding='utf-8')
          start_marker = '    {\n      "id": "wry_smile_expression",'
          end_marker = '    {\n      "id": "separate_repeated_interaction_occurrences",'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('wry rule markers not found exactly once')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          new_lines = [
              '    {',
              '      "id": "wry_smile_expression",',
              '      "target": "*",',
              '      "gesture": "*",',
              '      "meaning": [',
              '        "wry_smile = restrained/wry smile; context may make it bitter, resigned, awkward, dryly amused, or gently teasing",',
              '        "smirk remains valid for a more knowingly teasing, sardonic, or self-assured reading; both may share the same visual surface"',
              '      ],',
              '      "notes": [',
              '        "Choose wry_smile or smirk from context; do not infer mockery or superiority from the visual surface alone.",',
              '        "embarrassed_wry_smile and embarrassed_smirk remain valid blush variants of the same visual family."',
              '      ]',
              '    },',
          ]
          text = text[:start] + '\n'.join(new_lines) + '\n' + text[end:]
          p.write_text(text, encoding='utf-8', newline='\n')

          data = p.read_bytes()
          md5 = hashlib.md5(data).hexdigest()
          size = len(data)
          if md5 != '804583d164f86c0bf73fd25dd94df414' or size != 14923:
              raise SystemExit(f'unexpected interaction_rules result md5={md5} size={size}')

          manifest = Path('v061/updates2.dau')
          lines = manifest.read_text(encoding='utf-8').splitlines()
          prefix = 'ghost/master/config/interaction_rules.json\x01'
          for i, line in enumerate(lines):
              if line.startswith(prefix):
                  lines[i] = f'ghost/master/config/interaction_rules.json\x01{md5}\x01size={size}\x01'
                  break
          else:
              raise SystemExit('interaction_rules manifest entry missing')
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')
          print(f'interaction_rules md5={md5} size={size}')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v061/ghost/master/config/interaction_rules.json v061/updates2.dau
          git diff --cached --check
          git commit -m 'Refine wry smile expression guidance'
          git push
