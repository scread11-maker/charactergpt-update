name: Add blush surface variants

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-blush-surface-variants.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add blush variants and sync manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          surfaces_path = Path('v061/shell/master/surfaces.txt')
          table_path = Path('v061/shell/master/surfacetable.txt')
          manifest_path = Path('v061/updates2.dau')

          surfaces = surfaces_path.read_text(encoding='utf-8')
          original = surfaces

          def get_block(num):
              m = re.search(rf'(?m)^surface{num}\n\{{\n.*?\n\}}', surfaces, re.S)
              if not m:
                  raise SystemExit(f'surface{num} not found')
              return m.group(0)

          def blush_block(new_num, source_num):
              block = get_block(source_num)
              if 'element1,overlayfast,hoppe.png,0,0' in block:
                  raise SystemExit(f'surface{source_num} already has hoppe')
              body = block.replace(f'surface{source_num}\n', f'surface{new_num}\n', 1)
              needle = re.search(r'(?m)^element0,[^\n]+$', body)
              if not needle:
                  raise SystemExit(f'surface{source_num} missing element0')
              pos = needle.end()
              return body[:pos] + '\nelement1,overlayfast,hoppe.png,0,0' + body[pos:]

          variants = {
              31: 3,
              32: 4,
              33: 5,
              34: 6,
              35: 8,
              36: 23,
              37: 26,
              38: 28,
              112: 102,
              123: 120,
              124: 121,
              125: 122,
              131: 103,
              132: 104,
              133: 105,
              134: 106,
              135: 108,
              136: 113,
              137: 116,
              138: 118,
          }

          for new_num in variants:
              if re.search(rf'(?m)^surface{new_num}\n\{{', surfaces):
                  raise SystemExit(f'surface{new_num} already exists')

          # Insert 0-series blush variants after surface30.
          anchor = get_block(30)
          addition = '\n\n' + '\n\n'.join(blush_block(n, variants[n]) for n in range(31, 39))
          surfaces = surfaces.replace(anchor, anchor + addition, 1)

          # Insert surface112 between 111 and 113.
          anchor = get_block(111)
          surfaces = surfaces.replace(anchor, anchor + '\n\n' + blush_block(112, 102), 1)

          # Insert blush variants for the 120-series after 122.
          anchor = get_block(122)
          addition = '\n\n' + '\n\n'.join(blush_block(n, variants[n]) for n in (123, 124, 125))
          surfaces = surfaces.replace(anchor, anchor + addition, 1)

          # Insert the pose-matched 100-series variants after surface130.
          anchor = get_block(130)
          addition = '\n\n' + '\n\n'.join(blush_block(n, variants[n]) for n in range(131, 139))
          surfaces = surfaces.replace(anchor, anchor + addition, 1)

          # Keep the allocation note current.
          surfaces = surfaces.replace('//0～9、20～30、100～・・\\0の表情', '//0～9、20～38、100～138・・\\0の表情', 1)

          # Blinking: only expressions whose source already uses normal/kotti blink animation.
          surfaces = surfaces.replace(
              'surface.append1,9,101,109 //通常+照れ',
              'surface.append1,9,31,33,35,101,109,123,131,133,135 //通常+照れ',
              1,
          )
          surfaces = surfaces.replace(
              'surface.append21,29,111,119 //こっち見+照れ',
              'surface.append21,29,36,38,111,119,124,136,138 //こっち見+照れ',
              1,
          )

          # Mouth animation: blush variants inherit the source expression's talk group.
          surfaces = surfaces.replace(
              'surface.append0,1,3,6,8,20,21,23,28,100,101,103,106,108,110,111,113,118,120,121,122',
              'surface.append0,1,3,6,8,20,21,23,28,31,34,35,36,38,100,101,103,106,108,110,111,113,118,120,121,122,123,124,125,131,134,135,136,138',
              1,
          )
          surfaces = surfaces.replace(
              'surface.append2,102',
              'surface.append2,22,102,112',
              1,
          )
          surfaces = surfaces.replace(
              'surface.append4,104',
              'surface.append4,32,104,132',
              1,
          )
          surfaces = surfaces.replace(
              'surface.append5,25,26,105,115,116',
              'surface.append5,25,26,33,37,105,115,116,133,137',
              1,
          )

          # Keep Satori-list surface range aligned with the expanded expression set.
          surfaces = surfaces.replace(
              'surface.append0-9,20-29,100-119',
              'surface.append0-9,20-38,100-138',
              1,
          )

          if surfaces == original:
              raise SystemExit('surfaces.txt was not modified')
          surfaces_path.write_text(surfaces, encoding='utf-8', newline='\n')

          table = table_path.read_text(encoding='utf-8')
          table = table.replace('\t22,驚き+ほっぺ', '\t22,照れ驚き', 1)
          table = table.replace('\t30,照れ笑い-こっち見', '\t30,照れ微笑み-こっち見', 1)
          table = table.replace(
              '\t30,照れ微笑み-こっち見\n',
              '\t30,照れ微笑み-こっち見\n'
              '\t31,照れ不安\n'
              '\t32,照れ落ち込み\n'
              '\t33,照れ微笑み\n'
              '\t34,照れ目閉じ\n'
              '\t35,照れ冷笑\n'
              '\t36,照れ不安-こっち見\n'
              '\t37,照れ満面の笑み\n'
              '\t38,照れ冷笑-こっち見\n',
              1,
          )
          table = table.replace('\t112,-', '\t112,照れ驚き-顎に手', 1)
          table = table.replace(
              '\t122,悩む-ぐぬぬぬぬ\n',
              '\t122,悩む-ぐぬぬぬぬ\n'
              '\t123,照れ悩む\n'
              '\t124,照れ悩む-こっちみんな\n'
              '\t125,照れ悩む-ぐぬぬぬぬ\n',
              1,
          )
          table = table.replace('\t130,照れ笑い-顎に手+こっち見', '\t130,照れ微笑み-顎に手+こっち見', 1)
          table = table.replace(
              '\t130,照れ微笑み-顎に手+こっち見\n',
              '\t130,照れ微笑み-顎に手+こっち見\n'
              '\t131,照れ不安-顎に手\n'
              '\t132,照れ落ち込み-顎に手\n'
              '\t133,照れ微笑み-顎に手\n'
              '\t134,照れ目閉じ-顎に手\n'
              '\t135,照れ冷笑-顎に手\n'
              '\t136,照れ不安-顎に手+こっち見\n'
              '\t137,照れ満面の笑み-顎に手\n'
              '\t138,照れ冷笑-顎に手+こっち見\n',
              1,
          )
          table_path.write_text(table, encoding='utf-8', newline='\n')

          # Validate every new surface is exactly its source plus hoppe.
          final = surfaces_path.read_text(encoding='utf-8')
          def final_block(num):
              m = re.search(rf'(?m)^surface{num}\n\{{\n.*?\n\}}', final, re.S)
              if not m:
                  raise SystemExit(f'final surface{num} missing')
              return m.group(0)
          for new_num, source_num in variants.items():
              new = final_block(new_num).replace(f'surface{new_num}\n', '', 1)
              src = final_block(source_num).replace(f'surface{source_num}\n', '', 1)
              src = src.replace('\n}', '\nelement1,overlayfast,hoppe.png,0,0\n}', 1) if False else src
              # Normalize by removing only the added hoppe line from the new block.
              new_without_hoppe = new.replace('element1,overlayfast,hoppe.png,0,0\n', '', 1)
              if new_without_hoppe != src:
                  raise SystemExit(f'surface{new_num} does not match source{source_num} + hoppe')

          # Validate label normalization.
          required_labels = [
              '22,照れ驚き', '30,照れ微笑み-こっち見', '35,照れ冷笑',
              '112,照れ驚き-顎に手', '123,照れ悩む',
              '130,照れ微笑み-顎に手+こっち見', '135,照れ冷笑-顎に手',
          ]
          final_table = table_path.read_text(encoding='utf-8')
          for label in required_labels:
              if label not in final_table:
                  raise SystemExit(f'missing surfacetable label: {label}')

          # Sync update manifest with exact bytes.
          manifest = manifest_path.read_text(encoding='utf-8').splitlines()
          updates = {
              'shell/master/surfaces.txt': surfaces_path.read_bytes(),
              'shell/master/surfacetable.txt': table_path.read_bytes(),
          }
          for rel, data in updates.items():
              md5 = hashlib.md5(data).hexdigest()
              size = len(data)
              prefix = rel + '\x01'
              for i, line in enumerate(manifest):
                  if line.startswith(prefix):
                      manifest[i] = f'{rel}\x01{md5}\x01size={size}\x01'
                      break
              else:
                  raise SystemExit(f'manifest entry missing: {rel}')
              print(f'{rel}: md5={md5} size={size}')
          manifest_path.write_text('\n'.join(manifest) + '\n', encoding='utf-8', newline='\n')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v061/shell/master/surfaces.txt v061/shell/master/surfacetable.txt v061/updates2.dau
          git diff --cached --check
          git commit -m 'Add blush variants across shell expressions'
          git push
