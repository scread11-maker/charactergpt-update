name: Publish v071 GPU1 fix1
on:
  push:
    paths:
      - '.github/workflows/publish_v071_gpu1_fix1.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch shutdown-safe YAYA and rebuild manifest
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          p = Path('v071/ghost/master/cgpt_core.dic')
          s = p.read_text(encoding='utf-8-sig')
          old = '''OnClose
          {
              CGPT.IdleGeneration += 1
              CGPT.RestoreGeneration += 1
              "\\![execute,http-post,http://127.0.0.1:8782/shutdown,--nodescript,--nofile=UTF-8,--timeout=1]\\![execute,http-post,http://127.0.0.1:8769/shutdown,--nodescript,--nofile=UTF-8,--timeout=1]\\![send,websocket,ws://127.0.0.1:8766,SYSTEM|CLOSE]\\![close,websocket,ws://127.0.0.1:8766]\\0\\s[5]再見。\\-\\e"
          }'''
          new = '''OnClose
          {
              CGPT.IdleGeneration += 1
              CGPT.RestoreGeneration += 1
              _plug = ""
              if CGPT.ChatGPTLinkEnabled == 1 {
                  _plug = "\\![execute,http-post,http://127.0.0.1:8782/shutdown,--nodescript,--nofile=UTF-8,--timeout=1]"
              }
              "%(_plug)\\![send,websocket,ws://127.0.0.1:8766,SYSTEM|CLOSE]\\_w[120]\\![close,websocket,ws://127.0.0.1:8766]\\0\\s[5]再見。\\-\\e"
          }'''
          if old not in s:
              raise SystemExit('expected old OnClose block not found')
          p.write_text('\ufeff' + s.replace(old, new), encoding='utf-8')

          tracked = [
              'ghost/master/cgpt_core.dic',
              'ghost/master/cgpt_touch.dic',
              'ghost/master/descript.txt',
              'ghost/master/system_config.txt',
              'ghost/master/yaya.txt',
              'ghost/master/yaya_config.txt',
              'readme.txt',
          ]
          rows = []
          for rel in tracked:
              data = Path('v071', rel).read_bytes()
              rows.append(rel.encode() + b'\x01' + hashlib.md5(data).hexdigest().encode() + b'\x01size=' + str(len(data)).encode() + b'\x01\n')
          Path('v071/updates2.dau').write_bytes(b''.join(rows))
      - name: Commit channel and remove one-shot workflow
        run: |
          git config user.name 'CharacterGPT Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/publish_v071_gpu1_fix1.yml
          git add -A v071 .github/workflows/publish_v071_gpu1_fix1.yml
          git commit -m 'Publish SSPGPT v071 GPU1 fix1 shutdown-safe YAYA'
          git push
