name: Deploy v071 online-update channel

on:
  push:
    branches: [main]
    paths:
      - '.github/v071_stage.part1'
      - '.github/v071_stage.part2'
      - '.github/workflows/deploy-v071-channel.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and verify staged payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v071_stage.part1 .github/v071_stage.part2 | base64 -d > /tmp/v071_stage.tar.gz
          echo '9d21fdb7cb1277dbc6d92851fce4be3515277fe1ade3c58bdab5b20b761a364d  /tmp/v071_stage.tar.gz' | sha256sum -c -
          rm -rf /tmp/v071_stage
          mkdir -p /tmp/v071_stage
          tar -xzf /tmp/v071_stage.tar.gz -C /tmp/v071_stage
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('/tmp/v071_stage')
          manifest=root/'updates2.dau'
          if not manifest.is_file():
              raise SystemExit('updates2.dau missing')
          expected=set()
          for raw in manifest.read_bytes().splitlines():
              if not raw: continue
              fields=raw.split(b'\x01')
              if len(fields) < 3:
                  raise SystemExit(f'bad updates2 line: {raw!r}')
              rel=fields[0].decode('utf-8')
              md5=fields[1].decode('ascii')
              size=int(fields[2].decode('ascii').removeprefix('size='))
              p=root/rel
              if not p.is_file(): raise SystemExit(f'missing {rel}')
              data=p.read_bytes()
              if len(data)!=size: raise SystemExit(f'size mismatch {rel}')
              if hashlib.md5(data).hexdigest()!=md5: raise SystemExit(f'md5 mismatch {rel}')
              expected.add(rel)
          allowed=expected | {'updates2.dau'}
          actual={str(p.relative_to(root)).replace('\\','/') for p in root.rglob('*') if p.is_file()}
          if actual != allowed:
              raise SystemExit(f'unexpected stage files: {sorted(actual-allowed)} / missing: {sorted(allowed-actual)}')
          for rel in actual:
              low='/' + rel.lower()
              forbidden=('.exe','.dll','.db','.sqlite','.log','.bak','.secret','.key')
              if low.endswith(forbidden) or '/config/' in low or '/memory/' in low or '/profile/' in low:
                  raise SystemExit(f'forbidden online-update file: {rel}')
          print('v071 stage verified:', len(expected), 'manifest entries')
          PY
      - name: Publish channel atomically
        shell: bash
        run: |
          set -euo pipefail
          rm -rf v071
          cp -a /tmp/v071_stage/. v071/
          rm -f .github/v071_stage.part1 .github/v071_stage.part2 .github/workflows/deploy-v071-channel.yml
          git config user.name 'CharacterGPT Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Publish SSPGPT v0.7.1 online-update channel'
          git push origin HEAD:main
