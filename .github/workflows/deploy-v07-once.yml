name: Deploy SSPGPT v07 online update once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v07-once.yml'

permissions:
  contents: write

concurrency:
  group: deploy-v07-online-update
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified stage
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v07_stage.part1 .github/v07_stage.part2 | base64 -d > /tmp/v07_stage.tar.gz
          echo '5a84d294be4667b9c926d906a8c9bb74bcc100128ae2082dd2d3de20f7299d4e  /tmp/v07_stage.tar.gz' | sha256sum -c -
          rm -rf v07
          mkdir -p v07
          tar -xzf /tmp/v07_stage.tar.gz -C v07

      - name: Verify SSP update manifest and safety boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('v07')
          manifest = root / 'updates2.dau'
          assert manifest.is_file(), 'updates2.dau missing'
          records = []
          for raw in manifest.read_bytes().decode('utf-8').splitlines():
              if not raw:
                  continue
              parts = raw.split('\x01')
              assert len(parts) >= 3, raw
              rel, digest, size_field = parts[:3]
              assert size_field.startswith('size=')
              p = root / rel
              assert p.is_file(), f'missing {rel}'
              data = p.read_bytes()
              assert hashlib.md5(data).hexdigest() == digest, f'md5 mismatch {rel}'
              assert len(data) == int(size_field[5:]), f'size mismatch {rel}'
              records.append(rel)
          assert records, 'empty manifest'
          forbidden_suffixes = {'.exe', '.dll', '.log', '.jsonl', '.db', '.sqlite', '.sqlite3'}
          for p in root.rglob('*'):
              if p.is_file():
                  assert p.suffix.lower() not in forbidden_suffixes, f'forbidden online-update file: {p}'
          print('verified', len(records), 'online-update records')
          PY

      - name: Publish channel and remove one-shot staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CharacterGPT Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v07
          git rm -f .github/v07_stage.tar.gz.b64 .github/v07_stage.part1 .github/v07_stage.part2 .github/workflows/deploy-v07-once.yml
          git commit -m 'Publish SSPGPT v0.7 fix8 online-update channel'
          git push origin HEAD:main
