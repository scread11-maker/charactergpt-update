name: SSPGPT Go 1.26.5 Bootstrap Validate

on:
  pull_request:
    branches: [main]
    paths:
      - "build/sspgpt/source.parts/**"
      - ".github/workflows/sspgpt-bootstrap-go1265.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sspgpt-go1265-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.5'
          cache: false

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sspgpt-fix14
          mkdir -p /tmp/sspgpt-fix14/src
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build/sspgpt/source.parts/part-006')
          s = p.read_text(encoding='utf-8')
          bad = 'QbitosMXrM4RZ'
          good = 'QDtosMXrM4RZ'
          if s.count(bad) != 1:
              raise SystemExit(f'unexpected part-006 corruption count: {s.count(bad)}')
          p.write_text(s.replace(bad, good), encoding='utf-8')
          PY
          echo "91b91244ea22a1f47ef913c4f353310e8b6289d2da730ff43d5375c88b3063e2  build/sspgpt/source.parts/part-006" | sha256sum -c -
          : > /tmp/sspgpt-fix14/source.tar.xz
          while IFS= read -r f; do
            base64 --decode "$f" >> /tmp/sspgpt-fix14/source.tar.xz
          done < <(find build/sspgpt/source.parts -maxdepth 1 -type f -name 'part-*' | sort)
          echo "4deea8ced8a2bb9b308d4bc6273a4f727eda793d0b514f57f642e7d500e9c6ac  /tmp/sspgpt-fix14/source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sspgpt-fix14/source.tar.xz -C /tmp/sspgpt-fix14/src
          test -f /tmp/sspgpt-fix14/src/go.mod
          test -f /tmp/sspgpt-fix14/src/.go-version
          test -d /tmp/sspgpt-fix14/src/cmd
          test -d /tmp/sspgpt-fix14/src/internal

      - name: Verify exact Go 1.26.5 contract
        working-directory: /tmp/sspgpt-fix14/src
        env:
          GOTOOLCHAIN: local
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .go-version)" = "1.26.5"
          grep -Fx "go 1.26.0" go.mod
          grep -Fx "toolchain go1.26.5" go.mod
          go version
          test "$(go env GOVERSION)" = "go1.26.5"

      - name: Unit tests and vet
        working-directory: /tmp/sspgpt-fix14/src
        env:
          GOTOOLCHAIN: local
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...

      - name: Architecture and YAYA audits
        working-directory: /tmp/sspgpt-fix14/src
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v071_architecture_audit.py
          python3 tools/yaya_static_audit.py

      - name: Build Windows amd64 and 386
        working-directory: /tmp/sspgpt-fix14/src
        env:
          GOTOOLCHAIN: local
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_windows_amd64.sh
          bash scripts/build_windows_386.sh
          mkdir -p artifact/amd64 artifact/386
          cp -a dist/windows_amd64/. artifact/amd64/
          cp -a dist/windows386/. artifact/386/
          (cd artifact/amd64 && find . -type f -name '*.exe' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd artifact/386 && find . -type f -name '*.exe' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          go version > artifact/GO_VERSION.txt
          printf '%s\n' "${GITHUB_SHA}" > artifact/GIT_COMMIT.txt

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: SSPGPT-v07-fix14-go1265-windows-amd64
          path: /tmp/sspgpt-fix14/src/artifact/amd64
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: SSPGPT-v07-fix14-go1265-windows-386
          path: /tmp/sspgpt-fix14/src/artifact/386
          if-no-files-found: error
          retention-days: 30

      - name: Promote validated readable source branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --source=HEAD -- build/sspgpt/source.parts/part-006
          git fetch origin main
          git switch --force-create promotion/fix14-go1265-readable origin/main
          rm -rf build/sspgpt/src build/sspgpt/source.parts
          mkdir -p build/sspgpt/src
          cp -a /tmp/sspgpt-fix14/src/. build/sspgpt/src/
          rm -f .github/workflows/sspgpt-bootstrap-go1265.yml
          git add -A build/sspgpt .github/workflows/sspgpt-bootstrap-go1265.yml
          git commit -m "Promote validated SSPGPT fix14 Go 1.26.5 readable source"
          git push --force origin HEAD:refs/heads/promotion/fix14-go1265-readable
