name: SSPGPT Go 1.26.5 Bootstrap Validate

on:
  pull_request:
    branches: [main]
    paths:
      - "build/sspgpt/source.parts/**"
      - ".github/workflows/sspgpt-bootstrap-go1265.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sspgpt-go1265-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.5'
          cache: false

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sspgpt-fix14
          mkdir -p /tmp/sspgpt-fix14/src
          cat build/sspgpt/source.parts/part-* | base64 -d > /tmp/sspgpt-fix14/source.tar.xz
          echo "4deea8ced8a2bb9b308d4bc6273a4f727eda793d0b514f57f642e7d500e9c6ac  /tmp/sspgpt-fix14/source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sspgpt-fix14/source.tar.xz -C /tmp/sspgpt-fix14/src
          test -f /tmp/sspgpt-fix14/src/go.mod
          test -f /tmp/sspgpt-fix14/src/.go-version
          test -d /tmp/sspgpt-fix14/src/cmd
          test -d /tmp/sspgpt-fix14/src/internal

      - name: Verify exact Go 1.26.5 contract
        working-directory: /tmp/sspgpt-fix14/src
        env:
          GOTOOLCHAIN: local
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .go-version)" = "1.26.5"
          grep -Fx "go 1.26.0" go.mod
          grep -Fx "toolchain go1.26.5" go.mod
          go version
          test "$(go env GOVERSION)" = "go1.26.5"

      - name: Unit tests and vet
        working-directory: /tmp/sspgpt-fix14/src
        env:
          GOTOOLCHAIN: local
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...

      - name: Architecture and YAYA audits
        working-directory: /tmp/sspgpt-fix14/src
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v071_architecture_audit.py
          python3 tools/yaya_static_audit.py

      - name: Build Windows amd64 and 386
        working-directory: /tmp/sspgpt-fix14/src
        env:
          GOTOOLCHAIN: local
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_windows_amd64.sh
          bash scripts/build_windows_386.sh
          mkdir -p artifact/amd64 artifact/386
          cp -a dist/windows_amd64/. artifact/amd64/
          cp -a dist/windows386/. artifact/386/
          (cd artifact/amd64 && find . -type f -name '*.exe' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd artifact/386 && find . -type f -name '*.exe' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          go version > artifact/GO_VERSION.txt
          printf '%s\n' "${GITHUB_SHA}" > artifact/GIT_COMMIT.txt

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: SSPGPT-v07-fix14-go1265-windows-amd64
          path: /tmp/sspgpt-fix14/src/artifact/amd64
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: SSPGPT-v07-fix14-go1265-windows-386
          path: /tmp/sspgpt-fix14/src/artifact/386
          if-no-files-found: error
          retention-days: 30
