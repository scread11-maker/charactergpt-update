name: SSPGPT Go 1.26.6 Build

on:
  push:
    branches: [main]
    paths:
      - "build/sspgpt/**"
      - ".github/workflows/sspgpt-go1265.yml"
  pull_request:
    branches: [main]
    paths:
      - "build/sspgpt/**"
      - ".github/workflows/sspgpt-go1265.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sspgpt-go1266-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: build/sspgpt/src
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
          cache: false
      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .go-version)" = "1.26.6"
          grep -Fx "go 1.26.2" go.mod
          grep -Fx "toolchain go1.26.6" go.mod
          go version
          test "$(go env GOVERSION)" = "go1.26.6"
      - name: Unit tests
        env:
          GOTOOLCHAIN: local
        run: go test ./...
      - name: Vet
        env:
          GOTOOLCHAIN: local
        run: go vet ./...
      - name: Architecture audit
        run: python3 tools/v071_architecture_audit.py
      - name: YAYA static audit
        run: python3 tools/yaya_static_audit.py

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, "386"]
    defaults:
      run:
        working-directory: build/sspgpt/src
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
          cache: false
      - name: Build Windows binaries
        env:
          GOTOOLCHAIN: local
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact/output
          mkdir -p artifact/output
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            bash scripts/build_windows_amd64.sh
            src=dist/windows_amd64
          else
            bash scripts/build_windows_386.sh
            src=dist/windows386
          fi
          cp -a "$src"/. artifact/output/
          (
            cd artifact/output
            find . -type f -name '*.exe' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          go version > artifact/output/GO_VERSION.txt
          printf '%s\n' "${GITHUB_SHA}" > artifact/output/GIT_COMMIT.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: SSPGPT-v07-fix15-mcp-go1266-windows-${{ matrix.arch }}
          path: build/sspgpt/src/artifact/output
          if-no-files-found: error
          retention-days: 30
